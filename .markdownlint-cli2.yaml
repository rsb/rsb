# Repo-wide markdownlint-cli2 configuration, committed so every contributor and
# editor lints this repo's markdown identically — regardless of which directory
# the editor sets as its working directory (a home-dir config is only discovered
# when cwd is at or below it, which is why a global config alone is unreliable).
#
# NOTE: in a *.markdownlint-cli2.yaml file every option must be nested under the
# `config:` key (the flat layout is the schema for the other name, .markdownlint.yaml).
config:
  default: true

  # MD013: Line length
  MD013:
    line_length: 125
    code_blocks: false
    tables: false
    headings: false
