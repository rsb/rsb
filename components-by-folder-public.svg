<svg xmlns="http://www.w3.org/2000/svg" width="680" height="580" viewBox="0 0 680 580" role="img">
<title>RSB software factory: repos by folder</title>
<desc>The ~/code/software/rsb tree, one top-level folder per repo role. factory/ holds the gauge monorepo (the rsb-gauge-* engine crates, the gauge CLI, agent-driver, insights later) plus agent-registry, agent-box, agent-host and rsb-skills. projects/ holds services (daybook, rollout), desktop (lumen) and lib (errors-rs, libraw). ref/ holds the reference apps. research/ holds the record. Outside the tree: the gauge store (SQLite, later Cloudflare), the always-on desktop that runs the loop, and GitHub with the rsb-agent App.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;fill:#3d3d3a}
.th{font-size:14px;font-weight:500}.ts{font-size:12px}.tx{font-size:11px}
.box{fill:#f1efe8;stroke:#888780}.root{fill:none;stroke:#888780;stroke-dasharray:4 4}
.p{fill:#eeedfe;stroke:#534ab7}.pt{fill:#3c3489}
.g{fill:#e1f5ee;stroke:#0f6e56}.gt{fill:#085041}
.a{fill:#faeeda;stroke:#ba7517}.at{fill:#633806}
.dash{fill:none;stroke:#888780;stroke-dasharray:4 3}
@media (prefers-color-scheme:dark){
text{fill:#c2c0b6}.box{fill:#2c2c2a;stroke:#888780}
.p{fill:#3c3489;stroke:#afa9ec}.pt{fill:#eeedfe}
.g{fill:#085041;stroke:#5dcaa5}.gt{fill:#e1f5ee}
.a{fill:#633806;stroke:#ef9f27}.at{fill:#faeeda}}
</style>
<rect class="root" x="20" y="20" width="640" height="410" rx="16" stroke-width="0.5"/>
<text class="th" x="40" y="46">~/code/software/rsb</text>

